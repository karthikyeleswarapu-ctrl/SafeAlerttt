<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Emergency Alert</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#090909;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}

.container{

width:100%;
max-width:450px;

background:#151515;

border-radius:25px;

padding:25px;

text-align:center;

box-shadow:0 0 40px rgba(255,0,0,.35);

animation:flash 1s infinite;

}

@keyframes flash{

0%{
box-shadow:0 0 20px #ff0000;
}

50%{
box-shadow:0 0 60px #ff0000;
}

100%{
box-shadow:0 0 20px #ff0000;
}

}
  
@keyframes flashBanner{

0%{
background:#ff0000;
}

50%{
background:#8b0000;
}

100%{
background:#ff0000;
}

}  

.icon{

font-size:80px;

color:#ff3b3b;

margin-bottom:20px;

animation:pulse .8s infinite;

}

@keyframes pulse{

50%{
transform:scale(1.15);
}

}

h1{

font-size:32px;

color:#ff3b3b;

margin-bottom:15px;

}

.card{

background:#202020;

padding:18px;

border-radius:16px;

margin-top:20px;

}

.card p{

margin:12px 0;

font-size:18px;

}

iframe{

width:100%;

height:250px;

border:none;

border-radius:18px;

margin-top:20px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:14px;

font-size:18px;

margin-top:15px;

cursor:pointer;

font-weight:bold;

}

.map{

background:#1976ff;

color:white;

}

.safe{

background:#00b050;

color:white;

}

.dismiss{

background:#d32f2f;

color:white;

}

</style>

</head>

<body>

<div class="container">

<i class="fa-solid fa-triangle-exclamation icon"></i>

<h1>EMERGENCY ALERT</h1>
<div id="alertBanner" style="
background:#ff0000;
color:white;
padding:12px;
border-radius:12px;
font-weight:bold;
font-size:18px;
margin:15px 0;
animation:flashBanner .8s infinite;
">

🚨 EMERGENCY IN PROGRESS

</div>

<p id="receivedTime"
style="
color:#ffd54f;
margin-bottom:15px;
font-size:15px;
">

Received just now

</p>
<div class="card">

<p>
👤
<span id="name">
Unknown
</span>
</p>

<p>
📞
<span id="phone">
---
</span>
</p>

</div>

<iframe
id="map">
</iframe>

<button
class="map"
onclick="openMap()">

🗺 Open Google Maps

</button>

<button
class="map"
onclick="callSender()">

📞 Call Sender

</button>  
  
<button
class="map"
onclick="smsSender()">

💬 I'm Coming

</button>  
  
<button
class="safe"
onclick="imSafe()">

✅ I'm Safe

</button>

<button
class="dismiss"
onclick="dismissAlert()">

❌ Dismiss

</button>
</div>

<script type="module">

import { listenLiveLocation } from "./firestore.js";

const params=new URLSearchParams(location.search);

const lat=params.get("lat");

const lng=params.get("lng");
  
const uid = params.get("uid");  

const name=params.get("name");

const phone=params.get("phone");

if(name)
document.getElementById("name").innerText=name;

if(phone)
document.getElementById("phone").innerText=phone;

if(lat&&lng){

document.getElementById("map").src=

`https://maps.google.com/maps?q=${lat},${lng}&z=16&output=embed`;

}
    
let unsubscribe = null;    
    
if (uid) {

    unsubscribe = listenLiveLocation(uid, (data) => {

        if (!data || !data.liveLocation) return;

        const location = data.liveLocation;

        window.currentLat = location.latitude;
window.currentLng = location.longitude;
        
        document.getElementById("map").src =
`https://maps.google.com/maps?q=${location.latitude},${location.longitude}&z=16&output=embed`;

    });

}

const vibrationLoop = setInterval(() => {  
  
if(navigator.vibrate){

navigator.vibrate([
1000,200,
1000,200,
1000,200,
1000
]);

}
  }, 4000);

function openMap() {

    const mapLat = window.currentLat || lat;
    const mapLng = window.currentLng || lng;

    window.open(
        `https://maps.google.com/?q=${mapLat},${mapLng}`,
        "_blank"
    );

}
    
function imSafe(){
clearInterval(timer);
clearInterval(vibrationLoop)
alarm.pause();
alarm.currentTime = 0;

alert("Marked as Safe");
if (unsubscribe) unsubscribe();
window.close();

}

function dismissAlert(){
clearInterval(timer);
clearInterval(vibrationLoop)
    alarm.pause();

    alarm.currentTime = 0;
if (unsubscribe) unsubscribe();
    window.close();

}  
  
function callSender() {

    if (!phone) {
        alert("Phone number unavailable.");
        return;
    }

    window.location.href = `tel:${phone}`;
}

function smsSender() {

    if (!phone) {
        alert("Phone number unavailable.");
        return;
    }

    window.location.href =
        `sms:${phone}?body=I received your SafeAlert emergency. I'm coming.`;

}
  
let seconds = 0;

const timer =  
setInterval(()=>{

seconds++;

document.getElementById("receivedTime").innerHTML =

"Received " + seconds + " sec ago";

},1000); 
  
const alarm = document.getElementById("alarm");

setTimeout(() => {
    alarm.play().catch(() => {});
  
document.body.requestFullscreen?.();  
}, 500);  
window.addEventListener("beforeunload", () => {

    clearInterval(timer);
    clearInterval(vibrationLoop);

    if (unsubscribe) unsubscribe();

    alarm.pause();
    alarm.currentTime = 0;

});  
</script>
<audio id="alarm" loop>
    <source src="assets/sounds/siren.mp3" type="audio/mpeg">
</audio>
</body>
</html>
