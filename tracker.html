<!DOCTYPE html>
<html>

<head>

    <title>SafeAlert Live Tracker</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0">

    <style>

        html,
        body{
            margin:0;
            height:100%;
            font-family:Arial,sans-serif;
        }

        #map{
            width:100%;
            height:100%;
        }

        #status{

            position:absolute;
            top:10px;
            left:10px;

            background:white;

            padding:10px;

            border-radius:10px;

            z-index:999;

            font-weight:bold;

        }

    </style>

</head>

<body>

<div id="status">
Waiting for location...
</div>

<div id="map"></div>

<script type="module" src="tracker.js"></script>

<script
src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY">
</script>

</body>

</html>
